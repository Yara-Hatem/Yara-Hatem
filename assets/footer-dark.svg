<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="80" viewBox="0 0 900 80" role="img" aria-label="Thanks for flipping through my notebook!"><title>Thanks for flipping through my notebook!</title><style>@font-face{font-family:FNHand;src:url(data:font/woff2;base64,) format('woff2')}.hand{font-family:FNHand,'Segoe Print','Comic Sans MS',cursive}.handr{font-family:FNHandR,'Segoe Print','Comic Sans MS',cursive}.sans{font-family:FNSans,'Segoe UI',Helvetica,Arial,sans-serif}.sansr{font-family:FNSansR,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:FNMono,Consolas,Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.6,.1,.3,1) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.fade{animation:fade .7s ease-out backwards}
@keyframes fade{from{opacity:0}}
.rise{animation:rise .7s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.swipe{transform-box:fill-box;transform-origin:left center;animation:swipe .7s ease-out .2s backwards}
@keyframes swipe{from{transform:scaleX(0)}}
.pulse{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.wob{transform-box:fill-box;transform-origin:50% 0;animation:wob 5s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
</style><text class="hand" x="450.0" y="44" font-size="32" fill="#9EA3B5" text-anchor="middle">thanks for flipping through my notebook!</text>
